<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a73e8" />
    <title>K-Pocket</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>K-Pocket</h1>
      <p>말로 물어보면 공공데이터를 조회해 답합니다. 참고용·개인 비영리.</p>
    </header>
    <main>
      <p id="file-warning" class="card disclaimer hidden">
        file:// 로는 API가 막힙니다. Vercel 등에 올린 뒤 사용하세요.
      </p>
      <section id="chat-log" class="chat-log" aria-live="polite"></section>
      <form id="chat-form" class="chat-composer">
        <input
          id="chat-input"
          type="text"
          enterkeyhint="send"
          autocomplete="off"
          placeholder="예: 강남역 지하철 도착, 삼성전자 주식…"
        />
        <button type="submit">보내기</button>
      </form>
    </main>
    <script src="app.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
